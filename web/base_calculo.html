<style>
  /* Layout: caderno de fechamento — abas dos meses no topo, quadros do mês em grade, resumo anual em tabela */
  :root {
    --papel: #f5f6f3;
    --folha: #ffffff;
    --tinta: #1c2520;
    --suave: #5c6a63;
    --linha: #d8ded9;

    --ok: #23703f;
    --ok-fundo: #e5f3e9;
    --erro: #b3261e;
    --erro-fundo: #fbeaea;
    --aviso: #8a5a00;
    --aviso-fundo: #fff4dc;

    --f-titulo: "Source Serif 4", Georgia, "Times New Roman", serif;
    --f-texto: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #121815; --folha: #19211d; --tinta: #e4ebe6; --suave: #9aaba2; --linha: #2e3a34; --campo: #141b17;
      --verde: #7cc7a8; --verde-claro: #1f3a30; --cabeca: #222d27; --total: #1e2823;
      --ok: #7fd49a; --ok-fundo: #173323; --erro: #f2a19b; --erro-fundo: #3a1b19;
      --aviso: #f0c46a; --aviso-fundo: #352a12; --foco: #7cc7a8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --papel: #121815; --folha: #19211d; --tinta: #e4ebe6; --suave: #9aaba2; --linha: #2e3a34; --campo: #141b17;
    --verde: #7cc7a8; --verde-claro: #1f3a30; --cabeca: #222d27; --total: #1e2823;
    --ok: #7fd49a; --ok-fundo: #173323; --erro: #f2a19b; --erro-fundo: #3a1b19;
    --aviso: #f0c46a; --aviso-fundo: #352a12; --foco: #7cc7a8;

  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--papel); color: var(--tinta); font-family: var(--f-texto); font-size: 15px; line-height: 1.5; }
  .pagina {
    max-width: 1320px; margin: 0 auto; padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 18px;
  }
  .rotulo { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 500; }
  h1 { font-family: var(--f-titulo); font-weight: 600; font-size: clamp(24px, 3.6vw, 32px); line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
  h2 { font-family: var(--f-titulo); font-weight: 600; font-size: 21px; margin: 0; text-wrap: balance; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 0 0 8px; font-weight: 600; }
  .topo { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; }
  .topo > div { min-width: 0; }
  .identificacao { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .campo-topo { display: grid; gap: 4px; }
  .campo-topo label { font-size: 13px; font-weight: 600; }
  .campo-topo input { font: inherit; color: var(--tinta); background: var(--folha); border: 1px solid var(--linha); border-radius: 6px; padding: 7px 10px; }
  #entidade { width: min(460px, 100%); }
  #ano { width: 90px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--verde); background: var(--verde); color: var(--folha);
  }
  button.secundario { background: transparent; color: var(--verde); }
  button.perigo { background: var(--erro); border-color: var(--erro); color: var(--folha); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  .arquivo-botao { position: relative; display: inline-flex; }
  .arquivo-botao input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .arquivo-botao span {
    font-weight: 600; font-size: 14px; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--verde); color: var(--verde);
  }
  .arquivo-botao:focus-within span { outline: 2px solid var(--foco); outline-offset: 2px; }
  .nota { font-size: 13px; color: var(--suave); margin: 0; }
  .confirmacao { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--erro-fundo); color: var(--erro); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

  .abas { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--linha); padding-bottom: 0; }
  .aba {
    background: transparent; color: var(--suave); border: 0; border-bottom: 3px solid transparent; border-radius: 0;

  .aba[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--verde); }

  .mensagem { border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .mensagem.erro { background: var(--erro-fundo); color: var(--erro); }

  .mes-topo { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .pill.ok { background: var(--ok-fundo); color: var(--ok); }
  .pill.verificar { background: var(--erro-fundo); color: var(--erro); }

  .quadros { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
  .coluna { display: grid; gap: 18px; min-width: 0; }
  @media (max-width: 1100px) { .quadros { grid-template-columns: minmax(0, 1fr); } }
  .quadro { background: var(--folha); border: 1px solid var(--linha); border-radius: 8px; padding: 14px; min-width: 0; }
  .rolagem { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { background: var(--cabeca); text-align: center; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 7px 8px; font-weight: 600; color: var(--tinta); }
  th:first-child, td:first-child { text-align: left; }
  td { border-top: 1px solid var(--linha); padding: 3px 6px; white-space: nowrap; }
  td:first-child { white-space: normal; min-width: 140px; padding-left: 8px; }
  .financeiro { display: grid; gap: 14px; }
  td.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; padding-right: 8px; }
  td.p { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--suave); padding-right: 8px; }
  tr.total td { background: var(--total); font-weight: 600; }
  td.negativo { color: var(--erro); }
  input.valor {
    width: 100%; min-width: 124px; text-align: right; font-family: var(--f-num); font-size: 13.5px; font-variant-numeric: tabular-nums;
    background: var(--campo); color: var(--tinta); border: 1px solid transparent; border-radius: 4px; padding: 4px 6px;
  }
  input.valor:hover { border-color: var(--linha); }
  input.valor:focus { border-color: var(--verde); background: var(--folha); }
  input.valor.invalido { border-color: var(--erro); }
  .legenda { font-size: 12.5px; color: var(--suave); margin: 8px 0 0; }
  .indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .indicador { border: 1px solid var(--linha); border-radius: 6px; padding: 8px 12px; display: grid; gap: 2px; min-width: 0; }
  .indicador span { font-size: 12px; color: var(--suave); }
  .indicador strong { font-family: var(--f-num); font-weight: 500; font-size: 15.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .conferencias { display: grid; gap: 8px; }
  .conferencia { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; border-top: 1px solid var(--linha); padding-top: 8px; }
  .conferencia:first-child { border-top: 0; padding-top: 0; }
  .conferencia strong { font-family: var(--f-num); font-weight: 500; white-space: nowrap; }
  .dica { font-size: 13px; color: var(--aviso); background: var(--aviso-fundo); border-radius: 6px; padding: 6px 10px; }
  .resumo td.n, .resumo th { white-space: nowrap; }
  .form-parecer { display: grid; gap: 10px; }
  .form-parecer label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  .form-parecer label small { font-weight: 400; color: var(--suave); }
  .form-parecer input, .form-parecer textarea {
    font: inherit; font-size: 14px; font-weight: 400; color: var(--tinta); background: var(--campo);

  @media (prefers-reduced-motion: no-preference) { button { transition: filter .15s; } button:hover:not(:disabled) { filter: brightness(1.08); } }

<script>
"use strict";

const DADOS_INICIAIS = /*DADOS*/null/*FIM*/;
// Modelo do parecer (.docx em base64), embutido ao gerar o aplicativo.
const MODELO_PARECER = /*MODELO_PARECER*/null/*FIM*/;
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const NOMES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const CAMPOS = {
  receita_prevista: "C5", receita_atualizada: "D5", receita_realizada: "E5",
  superavit_previsto: "C7", superavit_atualizado: "D7", superavit_realizado: "E7",
  excesso_previsto: "C8", excesso_atualizado: "D8", excesso_realizado: "E8",
  saldo_mes_ant_previsto: "C9", saldo_mes_ant_atualizado: "D9", saldo_mes_ant_realizado: "E9",
  correntes_inicial: "C16", correntes_autorizada: "D16", correntes_execucao: "E16",
  capital_inicial: "C17", capital_autorizada: "D17", capital_execucao: "E17",
  reserva_inicial: "C19", reserva_autorizada: "D19", reserva_execucao: "E19",
  suplementacao_inicial: "C20", suplementacao_autorizada: "D20", suplementacao_execucao: "E20",
  especial_inicial: "C21", especial_autorizada: "D21", especial_execucao: "E21",
  anulacoes_inicial: "C22", anulacoes_autorizada: "D22", anulacoes_execucao: "E22",
  transf_recebida_orcamentaria: "K6", receita_extraorcamentaria: "K7",
  transf_recebida_extraorcamentaria: "K8", saldo_exercicio_anterior: "K9",
  transf_concedida_orcamentaria: "M6", despesa_extraorcamentaria: "M7",
  transf_concedida_extraorcamentaria: "M8", saldo_final: "M9",
};
// Campos que costumam se repetir de um mês para o outro (previsões e dotações).
const REPETIDOS = ["receita_prevista", "receita_atualizada", "correntes_inicial", "correntes_autorizada",
  "capital_inicial", "capital_autorizada", "reserva_inicial", "reserva_autorizada",
  "suplementacao_autorizada", "anulacoes_autorizada"];
const CHAVE = "base-calculo-femta-v1";

/* ---------- Estado (valores em centavos) ---------- */

function vazio() { return Object.fromEntries(MESES.map((m) => [m, {}])); }
const LEI_PADRAO = "Lei Orçamentária n° 3.838, de 16 de junho de 2025";
let estado = { meses: vazio(), aba: "jan", parecer: { lei: LEI_PADRAO, meses: {} } };

function v(mes, campo) { return estado.meses[mes][campo] ?? 0; }

function salvarLocal() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      meses: estado.meses, entidade: $("entidade").value, ano: $("ano").value, aba: estado.aba, parecer: estado.parecer,
    }));
  } catch { /* armazenamento indisponível */ }
}

function carregarLocal() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (!bruto) return false;
    const dados = JSON.parse(bruto);
    if (!dados?.meses) return false;
    estado.meses = { ...vazio(), ...dados.meses };
    if (dados.entidade != null) $("entidade").value = dados.entidade;
    if (dados.ano) $("ano").value = dados.ano;
    if (MESES.includes(dados.aba) || dados.aba === "resumo") estado.aba = dados.aba;
    if (dados.parecer?.meses) estado.parecer = { lei: dados.parecer.lei || LEI_PADRAO, meses: dados.parecer.meses };
    return true;
  } catch { return false; }
}

/* ---------- Cálculo (igual às fórmulas da planilha) ---------- */

function calcular() {
  const r = {};
  let ant = null;
  for (const m of MESES) {
    const x = {};
    x.despTotal = v(m, "correntes_execucao") + v(m, "capital_execucao");
    x.dotIni = v(m, "correntes_inicial") + v(m, "capital_inicial");
    x.dotAut = v(m, "correntes_autorizada") + v(m, "capital_autorizada");
    x.despOrc = x.despTotal - v(m, "anulacoes_execucao");
    x.saldoAnterior = ant ? r[ant].saldoFinal : v(m, "saldo_exercicio_anterior");
    x.saldoFinal = v(m, "saldo_final");
    x.ingressos = v(m, "receita_realizada") + v(m, "transf_recebida_orcamentaria") + v(m, "receita_extraorcamentaria")
      + v(m, "transf_recebida_extraorcamentaria") + x.saldoAnterior;
    x.dispendios = x.despOrc + v(m, "transf_concedida_orcamentaria") + v(m, "despesa_extraorcamentaria")
      + v(m, "transf_concedida_extraorcamentaria") + x.saldoFinal;
    x.roRe = v(m, "receita_realizada") + v(m, "receita_extraorcamentaria");
    x.doDe = x.despOrc + v(m, "despesa_extraorcamentaria");
    x.rfp = x.roRe - x.doDe;
    x.diferenca = v(m, "receita_realizada") - x.despTotal;
    x.recAcum = v(m, "receita_realizada") + (ant ? r[ant].recAcum : 0);
    x.despAcum = x.despOrc + (ant ? r[ant].despAcum : 0);
    x.dotAcumIni = x.dotIni + v(m, "reserva_inicial") + v(m, "suplementacao_inicial") + v(m, "especial_inicial") - v(m, "anulacoes_inicial");
    x.dotAcumAut = x.dotAut + v(m, "reserva_autorizada");
    x.confBalanco = x.ingressos - x.dispendios;
    x.confDotacao = x.dotAut - (x.dotIni + v(m, "suplementacao_autorizada") - v(m, "anulacoes_autorizada"));
    x.vazio = Object.values(estado.meses[m]).every((n) => !n);
    x.situacao = x.vazio ? "vazio" : (x.confBalanco === 0 && x.confDotacao === 0 ? "ok" : "verificar");
    r[m] = x;
    ant = m;
  }
  return r;
}

/* ---------- Formatação ---------- */

const NUM = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PCT = new Intl.NumberFormat("pt-BR", { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = (c) => NUM.format(c / 100);
const pct = (a, b) => (b ? PCT.format(a / b) : "0,00%");

function paraCentavos(texto) {
  let t = String(texto ?? "").replace(/R\$/g, "").replace(/\s/g, "");
  if (!t) return 0;
  let neg = false;
  if (t.startsWith("(") && t.endsWith(")")) { neg = true; t = t.slice(1, -1); }
  if (t.startsWith("-")) { neg = !neg; t = t.slice(1); }
  if (t.includes(",") && t.includes(".")) {
    t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  } else if (t.includes(",")) t = t.replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  if (!/^\d+(\.\d+)?$/.test(t)) return null;
  const [i, d = ""] = t.split(".");
  const c = Number(i) * 100 + Math.round(Number((d + "000").slice(0, 3)) / 10);
  return neg ? -c : c;
}

/* ---------- Interface ---------- */

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, val] of Object.entries(props)) {
    if (k === "class") e.className = val;
    else if (k === "text") e.textContent = val;
    else e.setAttribute(k, val);
  }
  e.append(...filhos.filter((f) => f != null));
  return e;
}

function entrada(mes, campo, rotulo) {
  const input = el("input", { class: "valor", type: "text", inputmode: "decimal", "aria-label": rotulo, id: `c-${mes}-${campo}` });
  input.value = fmt(v(mes, campo));
  input.addEventListener("change", () => {
    const c = paraCentavos(input.value);
    if (c === null) { input.classList.add("invalido"); return; }
    input.classList.remove("invalido");
    if (c) estado.meses[mes][campo] = c; else delete estado.meses[mes][campo];
    input.value = fmt(c);
    salvarLocal();
    // Espera o foco ir para o próximo campo (Tab/Enter) antes de redesenhar.
    setTimeout(atualizar, 0);
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  input.addEventListener("focus", () => input.select());
  return el("td", {}, input);
}

const num = (c, extra = "") => el("td", { class: `n ${c < 0 ? "negativo" : ""} ${extra}`, text: fmt(c) });
const per = (a, b) => el("td", { class: "p", text: pct(a, b) });

function tabela(cabecalho, linhas) {
  return el("div", { class: "rolagem" }, el("table", {},
    el("thead", {}, el("tr", {}, ...cabecalho.map((h) => el("th", { text: h })))),
    el("tbody", {}, ...linhas)));
}

function quadroReceita(m, r) {
  const x = r[m];
  const linha = (rotulo, pre) => el("tr", {}, el("td", { text: rotulo }),
    entrada(m, `${pre}_previsto`, `${rotulo} prevista`), entrada(m, `${pre}_atualizado`, `${rotulo} atualizada`),
    entrada(m, `${pre}_realizado`, `${rotulo} realizada`),
    per(v(m, `${pre}_realizado`), v(m, `${pre}_previsto`)), per(v(m, `${pre}_realizado`), v(m, `${pre}_atualizado`)));
  const prev = v(m, "receita_prevista"), atu = v(m, "receita_atualizada"), real = v(m, "receita_realizada");
  return el("section", { class: "quadro" }, el("h3", { text: "Quadro 1 · Receita" }), tabela(
    ["Títulos", "Receita prevista", "Receita atualizada", "Realização", "% previsto", "% atualizado"], [
      el("tr", {}, el("td", { text: "Receitas Correntes" }),

/* ---------- Importação ---------- */

function numeroCelula(valor) {
  if (valor == null || valor === "") return 0;
  if (typeof valor === "number") return Math.round(valor * 100);
  if (valor instanceof Date) return null;
  if (typeof valor === "object") {
    if (typeof valor.result === "number") return Math.round(valor.result * 100);
    if (valor.formula && /^[\d.\s+-]+$/.test(valor.formula)) {
      return valor.formula.match(/[-+]?\s*[\d.]+/g).reduce((s, p) => s + Math.round(Number(p.replace(/\s/g, "")) * 100), 0);
    }
    if (valor.richText) return paraCentavos(valor.richText.map((t) => t.text).join(""));
    return null;
  }
  const t = String(valor).trim();
  if (!t) return 0;
  if (t.startsWith("=") && /^=[\d.\s+-]+$/.test(t)) return numeroCelula({ formula: t.slice(1) });
  return paraCentavos(t);
}

async function importar(arquivo) {
  const livro = new ExcelJS.Workbook();
  try { await livro.xlsx.load(await arquivo.arrayBuffer()); }
  catch { throw new Error("Não foi possível abrir a planilha. Salve como .xlsx e tente de novo."); }
  const abas = Object.fromEntries(livro.worksheets.map((w) => [w.name.trim().toLowerCase(), w]));
  if (!MESES.some((m) => abas[m])) throw new Error("A planilha não tem abas com os nomes dos meses (jan, fev, …).");
  const meses = vazio();
  const problemas = [];
  for (const m of MESES) {
    const aba = abas[m];
    if (!aba) continue;
    for (const [campo, ref] of Object.entries(CAMPOS)) {
      if (m !== "jan" && campo === "saldo_exercicio_anterior") continue;
      const c = numeroCelula(aba.getCell(ref).value);
      if (c === null) problemas.push(`${m} ${ref}`);
      else if (c) meses[m][campo] = c;
    }
  }
  if (problemas.length) throw new Error(`Valores não reconhecidos nas células: ${problemas.slice(0, 12).join(", ")}${problemas.length > 12 ? "…" : ""}.`);
  const d4 = abas["resumo anual"]?.getCell("D4").value;
  return { meses, ano: d4 instanceof Date ? d4.getUTCFullYear() : null };
}

async function gerarPlanilha() {

  const MOEDA_S = '"R$"\\ #,##0.00;[Red]\\-"R$"\\ #,##0.00';

      aba.mergeCells(`${ref}:${ref[0]}4`);
    }
    const titulosRec = { 5: "Receitas Correntes", 6: "Total", 7: "Superávit Fin. Exer. Anterior", 8: "Excesso de Arrecadação", 9: "Saldo do Mês Anterior", 10: "Total Acumulado" };
    for (const [l, t] of Object.entries(titulosRec)) {

      for (const col of "CDE") {

        if (l === "6") valor = `=${col}5`;
        else if (l === "10") valor = col === "E" ? (ant ? `=${ant}!E10+${m}!E6` : "=E6") : `=${col}6`;
        else valor = val(m, `${col}${l}`);
        put(aba, `${col}${l}`, valor, { negrito: destaque, fundo, formato: MOEDA, alin: l === "10" ? centro : meio });
      }
      put(aba, `F${l}`, `=IFERROR(E${l}/C${l},0)`, { negrito: destaque, fundo, formato: PERC, alin: centro });
      put(aba, `G${l}`, `=IFERROR(E${l}/D${l},0)`, { negrito: destaque, fundo, formato: PERC, alin: centro });

    put(aba, "L3", "DESPESA", { negrito: true, fundo: ESCURO, alin: centro }); put(aba, "M3", null, { fundo: ESCURO }); aba.mergeCells("L3:M3");
    put(aba, "J4", "INGRESSOS", { negrito: true, fundo: CLARO, alin: centro });

    const ing = { 5: "Receita Orçamentária", 6: "Transf. Recebida Orçamentária", 7: "Receita Extraorçamentária", 8: "Transf. Recebida Extraorçamentária", 9: ant ? "Saldo do Mês Anterior" : "Saldo do Exercício Anterior" };

        else valor = val(m, `${col}${l}`);

    put(aba, "J17", "=J15-J16", { negrito: true, formato: MOEDA_S, alin: centro }); put(aba, "K17", "RFP", { negrito: true, alin: centro });

function resumoAnual(livro, ano, put, ESCURO, CLARO, centro) {
  const aba = livro.addWorksheet("Resumo Anual", { views: [{ showGridLines: false, zoomScale: 90 }] });
  const larguras = { A: 9, B: 39.4, C: 33.4, D: 23.3, E: 23.3, F: 23.3, G: 22.7, H: 23.3, I: 22.3 };
  for (const [col, w] of Object.entries(larguras)) aba.getColumn(col).width = w;
  const T = "Times New Roman";
  const MOEDA = '"R$"\\ #,##0.00';
  const esquerda = { horizontal: "left", vertical: "middle" };
  const col = (c, j) => String.fromCharCode(c.charCodeAt(0) + j);
  const s1 = MESES.slice(0, 6), s2 = MESES.slice(6);

  const cabMeses = (l, c0, meses) => meses.forEach((m, j) => put(aba, `${col(c0, j)}${l}`, new Date(Date.UTC(ano, MESES.indexOf(m), 1)),
    { fonte: T, negrito: true, fundo: ESCURO, formato: "mmm-yy", alin: centro }));
  const porMes = (meses, c0, celula) => Object.fromEntries(meses.map((m, j) => [col(c0, j), `=${m}!${celula}`]));
  const cada = (meses, c0, f) => Object.fromEntries(meses.map((_, j) => [col(c0, j), f(col(c0, j))]));

  function bloco(l, tituloC, tituloMeses, meses, linhas, c0) {
    put(aba, `B${l}`, "TÍTULOS", { fonte: T, negrito: true, fundo: ESCURO, alin: centro });
    put(aba, `B${l + 1}`, null, { fonte: T, fundo: ESCURO }); aba.mergeCells(`B${l}:B${l + 1}`);
    if (tituloC) {
      put(aba, `C${l}`, tituloC, { fonte: T, negrito: true, fundo: ESCURO, alin: centro });
      put(aba, `C${l + 1}`, null, { fonte: T, fundo: ESCURO }); aba.mergeCells(`C${l}:C${l + 1}`);
    }
    const ultima = col(c0, meses.length - 1);
    for (let j = 0; j < meses.length; j++) put(aba, `${col(c0, j)}${l}`, j ? null : tituloMeses, { fonte: T, negrito: true, fundo: ESCURO, alin: centro });
    aba.mergeCells(`${c0}${l}:${ultima}${l}`);
    cabMeses(l + 1, c0, meses);
    linhas.forEach(([titulo, destaque, formulas], k) => {
      const r = l + 2 + k;
      const fundo = destaque ? CLARO : undefined;
      put(aba, `B${r}`, titulo, { fonte: T, negrito: destaque, fundo });
      for (const [c, f] of Object.entries(formulas(r))) put(aba, `${c}${r}`, f, { fonte: T, negrito: destaque, fundo, formato: MOEDA, alin: centro });
    });
  }

  const receita = (meses, c0, previsao, acumAnt) => {
    const extra = (f) => (previsao ? { C: f } : {});
    return [
      ["Receitas Correntes", false, () => ({ ...extra("=dez!D5"), ...porMes(meses, c0, "E5") })],
      ["Total", true, (r) => ({ ...extra(`=SUM(C${r - 1})`), ...cada(meses, c0, (c) => `=SUM(${c}${r - 1})`) })],
      ["Superávit Fin. Exer. Anterior", false, () => ({ ...extra("=dez!D7"), ...porMes(meses, c0, "E7") })],
      ["Excesso de Arrecadação", false, () => ({ ...extra("=dez!D8"), ...porMes(meses, c0, "E8") })],
      ["Saldo do Mês Anterior", false, () => ({ ...extra("=dez!D9"), ...porMes(meses, c0, "E9") })],
      ["Total Acumulado", true, (r) => {
        const out = {};
        meses.forEach((_, j) => {
          const c = col(c0, j);
          const anterior = j ? `${col(c, -1)}${r}` : acumAnt;
          out[c] = `=SUM(${c}${r - 4}:${c}${r - 1})${anterior ? `+${anterior}` : ""}`;
        });
        if (previsao) out.C = `=SUM(C${r - 4}:C${r - 1})`;
        return out;
      }],
    ];
  };
  const tRec = `ARRECADAÇÃO CONFORME BALANCETES ANALISADOS NO PERÍODO DE JAN A DEZ DE ${ano}`;
  const tDesp = `DESPESAS CONFORME BALANCETES ANALISADOS NO PERÍODO DE JAN A DEZ DE ${ano}`;
  bloco(3, "PREVISÃO ATUALIZADA", tRec, s1, receita(s1, "D", true, null), "D");
  bloco(12, null, tRec, s2, receita(s2, "C", false, "I10"), "C");

  const despesa = (meses, c0, dot) => {
    const extra = (f) => (dot ? { C: f } : {});
    return [
      ["Despesas Correntes", false, () => ({ ...extra("=dez!D16"), ...porMes(meses, c0, "E16") })],
      ["Despesas de Capital", false, () => ({ ...extra("=dez!D17"), ...porMes(meses, c0, "E17") })],
      ["Total", true, (r) => ({ ...extra(`=SUM(C${r - 2}:C${r - 1})`), ...cada(meses, c0, (c) => `=SUM(${c}${r - 2}:${c}${r - 1})`) })],
      ["Suplementação", false, () => ({ ...extra("=dez!D20"), ...porMes(meses, c0, "D20") })],
      ["Anulações", false, () => ({ ...extra("=dez!D22"), ...porMes(meses, c0, "D22") })],
      ["Total Acumulado", true, () => ({ ...extra("=dez!D23"), ...porMes(meses, c0, "E23") })],
    ];
  };
  bloco(22, "DOTAÇÃO ATUALIZADA", tDesp, s1, despesa(s1, "D", true), "D");
  bloco(31, null, tDesp, s2, despesa(s2, "C", false), "C");

  function financeiro(l, meses, titulo, total, itens) {
    put(aba, `B${l}`, titulo, { fonte: T, negrito: true, fundo: ESCURO, alin: centro });
    cabMeses(l, "C", meses);
    put(aba, `B${l + 1}`, total, { fonte: T, negrito: true, fundo: CLARO, alin: centro });
    meses.forEach((_, j) => put(aba, `${col("C", j)}${l + 1}`, `=SUM(${col("C", j)}${l + 2}:${col("C", j)}${l + 6})`,
      { fonte: T, negrito: true, fundo: CLARO, formato: MOEDA, alin: centro }));
    itens.forEach(([rotulo, celula], k) => {
      const r = l + 2 + k;
      put(aba, `B${r}`, rotulo, { fonte: T, alin: esquerda });
      for (const [c, f] of Object.entries(porMes(meses, "C", celula))) put(aba, `${c}${r}`, f, { fonte: T, formato: MOEDA, alin: centro });
    });
  }
  const ingressos = [["Receita Orçamentária", "K5"], ["Transf. Recebida Orçamentária", "K6"], ["Receita Extraorçamentária", "K7"],
    ["Transf. Recebida Extraorçamentária", "K8"], ["Saldo Anterior", "K9"]];
  const dispendios = [["Despesa Orçamentária", "M5"], ["Transf. Concedida Orçamentária", "M6"], ["Despesa Extraorçamentária", "M7"],
    ["Transf. Concedida Extraorçamentária", "M8"], ["Saldo para o Exercício Seguinte", "M9"]];
  financeiro(41, s1, "RECEITA", "INGRESSOS", ingressos);
  financeiro(48, s1, "DESPESA", "DISPÊNDIOS", dispendios);
  financeiro(57, s2, "RECEITA", "INGRESSOS", ingressos);
  financeiro(64, s2, "DESPESA", "DISPÊNDIOS", dispendios);
}

/* ---------- Parecer mensal (Word) ---------- */

const UNIDADES = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze",
  "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
const DEZENAS = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
const CENTENAS = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos",
  "oitocentos", "novecentos"];
const ESCALAS = [null, ["mil", "mil"], ["milhão", "milhões"], ["bilhão", "bilhões"], ["trilhão", "trilhões"]];

function ate999(n) {
  if (n === 100) return "cem";
  const partes = [];
  if (n >= 100) partes.push(CENTENAS[Math.floor(n / 100)]);
  const r = n % 100;
  if (r) partes.push(r < 20 ? UNIDADES[r] : DEZENAS[Math.floor(r / 10)] + (r % 10 ? ` e ${UNIDADES[r % 10]}` : ""));
  return partes.join(" e ");
}

function inteiroPorExtenso(n) {
  if (n === 0) return "zero";
  const grupos = [];
  for (; n > 0; n = Math.floor(n / 1000)) grupos.push(n % 1000);
  const partes = [];
  for (let i = grupos.length - 1; i >= 0; i--) {
    const g = grupos[i];
    if (!g) continue;
    const texto = i === 0 ? ate999(g) : i === 1 ? (g === 1 ? "mil" : `${ate999(g)} mil`)
      : `${ate999(g)} ${ESCALAS[i][g === 1 ? 0 : 1]}`;
    partes.push({ texto, g });
  }
  // "e" antes de grupo menor que 100 ou centena redonda; vírgula nos demais.
  return partes.map((p, k) => (k === 0 ? "" : (p.g < 100 || p.g % 100 === 0 ? " e " : ", ")) + p.texto).join("");
}

function reaisPorExtenso(centavos) {
  const negativo = centavos < 0;
  const abs = Math.abs(centavos);
  const inteiro = Math.floor(abs / 100), cent = abs % 100;
  const partes = [];
  if (inteiro) {
    const de = inteiro >= 1e6 && inteiro % 1e6 === 0 ? " de" : "";
    partes.push(`${inteiroPorExtenso(inteiro)}${de} ${inteiro === 1 ? "real" : "reais"}`);
  }
  if (cent) partes.push(`${inteiroPorExtenso(cent)} ${cent === 1 ? "centavo" : "centavos"}`);
  const texto = partes.join(" e ") || "zero real";
  return negativo ? `menos ${texto}` : texto;
}

const rs = (c) => (c < 0 ? `- R$ ${fmt(-c)}` : `R$ ${fmt(c)}`);
const rsExtenso = (c) => `${rs(c)} (${reaisPorExtenso(c)})`;
const pctTexto = (a, b) => (b ? PCT.format(a / b) : "0,00%");
const NUM_MESES = ["um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze"];

function dadosParecer(m) {
  estado.parecer.meses[m] ??= {};
  return estado.parecer.meses[m];
}

function dataPorExtenso(iso) {
  const [a, mm, d] = (iso || "").split("-").map(Number);
  if (!a || !mm || !d) return "";
  return `ao dia ${d} de ${NOMES[mm - 1].toLowerCase()} de ${a}`;
}

function hojeIso() {
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, "0")}-${String(h.getDate()).padStart(2, "0")}`;
}

/** Textos do parecer: listas de [texto, negrito]. */
function textosParecer(m, r) {
  const i = MESES.indexOf(m);

  const composicao = (p.composicao || "").trim().replace(/[.,;]+$/, "");

    ["No quadro 1, verifica-se que a receita orçamentária arrecadada no mês foi ", false],

    [`${composicao ? `, composta por ${composicao},` : ","} que representa `, false],

    [pctTexto(real, atu), true], [" da receita atualizada. O total acumulado ", false],
    [rsExtenso(x.recAcum), true], [" que representa ", false],
    [pctTexto(x.recAcum, prev), true], [" do valor previsto e ", false],
    [pctTexto(x.recAcum, atu), true], [" do valor atualizado.", false],

  let execucao;
  if (!x.despTotal) execucao = [["No quadro 2, constata-se que no período analisado não houve execução de despesas.", false]];
  else {
    const detalhe = !capital ? ", integralmente em despesas correntes, não tendo sido registrado empenho em despesas de capital no mês."
      : !correntes ? ", integralmente em despesas de capital, não tendo sido registrado empenho em despesas correntes no mês."
        : `, sendo ${rs(correntes)} em despesas correntes e ${rs(capital)} em despesas de capital.`;
    execucao = [["No quadro 2, constata-se que no período analisado houve execução das despesas no valor de ", false],

  }

    : "";
  t.TXT_Q2 = [...execucao, [`${anulacoes} Sendo assim, o valor acumulado até o período foi de `, false],
    [rsExtenso(x.despAcum), true],
    [`, correspondente a ${pctTexto(x.despAcum, x.dotAcumIni)} da dotação. A dotação atualizada para o período em análise foi estabelecida no valor de `, false],
    [rsExtenso(x.dotAcumAut), true], [".", false]];

  const inicioDot = "Essa dotação contempla não apenas o montante inicialmente previsto no orçamento, mas também considera as alterações realizadas ao longo do período.";
  let dot;
  if (!supl && !anul) dot = ` Até o mês de ${mes}, não houve suplementações nem anulações de dotação, razão pela qual a dotação autorizada permanece idêntica à inicialmente fixada.`;
  else if (supl === anul) dot = ` Até o mês de ${mes}, as suplementações acumuladas somam ${rs(supl)}, integralmente compensadas por anulações de dotação de igual valor, razão pela qual a dotação autorizada permanece idêntica à inicialmente fixada.`;
  else {

    dot = ` Até o mês de ${mes}, as suplementações acumuladas somam ${rs(supl)} e as anulações de dotação somam ${rs(anul)}, o que resultou em ${dif > 0 ? "acréscimo líquido" : "redução líquida"} de ${rs(Math.abs(dif))} na dotação autorizada em relação à inicialmente fixada.`;
  }

  const resOrc = x.diferenca;

    : resOrc > 0 ? "representando um superávit no período, visto que a realização da receita foi superior à execução da despesa."
      : "representando equilíbrio no período, visto que a realização da receita foi igual à execução da despesa.";
  t.TXT_RESULTADO_ORC = [["O Resultado da Execução Orçamentária no mês foi de ", false], [rsExtenso(resOrc), true],
    [`, obtido pela diferença entre a receita realizada no mês, de ${rs(real)}, e a despesa empenhada no mês, de ${rs(x.despTotal)}, ${situacaoOrc}`, false]];

  t.TXT_RESUMO_BF = [[`Resumidamente, o Balanço Financeiro relativo ao período de ${mesAno} apresenta-se da seguinte forma:`, false]];

  const efeito = x.rfp < 0 ? "redução" : x.rfp > 0 ? "aumento" : "manutenção";
  t.TXT_RFP = [["O Resultado Financeiro do Período (RFP) foi de ", false], [rsExtenso(x.rfp), true],
    [` obtido pela diferença entre a soma das receitas orçamentárias e extraorçamentárias (RO+RE), de ${rs(x.roRe)}, e a soma das despesas orçamentárias e extraorçamentárias (DO+DE), de ${rs(x.doDe)}, o que representou ${efeito} do saldo das disponibilidades ao final do mês de ${mesAno}, conforme demonstrado no quadro 4 abaixo:`, false]];

  const negativo = x.rfp < 0;

    : "Um bom controle orçamentário e financeiro é fundamental para garantir a sustentabilidade e eficiência das finanças públicas. O resultado positivo observado no resultado financeiro do período deve ser acompanhado, no intuito de manter o equilíbrio financeiro e o atendimento das necessidades da instituição.", false]];

  const anterior = i ? `verificado ao final de ${NOMES[i - 1].toLowerCase()} de ${ano}` : "verificado ao final do exercício anterior";
  const decorridos = i ? `Decorridos ${NUM_MESES[i]} meses do exercício` : "Decorrido um mês do exercício";
  t.TXT_CONCLUSAO = [[`Em conclusão, o resultado financeiro ${negativo ? "negativo" : "positivo"} de `, false], [rsExtenso(x.rfp), true],
    [` apurado em ${mesAno} ${negativo ? "reduziu" : x.rfp > 0 ? "elevou" : "manteve"} o saldo em espécie do Fundo de ${rs(x.saldoAnterior)}, ${anterior}, para `, false],
    [rsExtenso(x.saldoFinal), true],
    [`, montante que se transfere para o período seguinte. ${decorridos}, o Fundo acumula arrecadação de ${rs(x.recAcum)}, equivalente a ${pctTexto(x.recAcum, prev)} da receita prevista, e empenhos de ${rs(x.despAcum)}, correspondentes a ${pctTexto(x.despAcum, x.dotAcumAut)} da dotação autorizada.`, false]];

  t.TXT_INFORMACAO = [[negativo
    ? `Essa informação é essencial para gestão financeira e orçamentária, pois mostra que as receitas do período foram insuficientes para cobrir as despesas realizadas, ainda que o Fundo mantenha disponibilidade financeira de ${rs(x.saldoFinal)} ao final do mês. Entretanto, é importante destacar que segundo o MCASP um resultado financeiro negativo é indicador de desequilíbrio financeiro.`
    : `Essa informação é essencial para gestão financeira e orçamentária, pois mostra que as receitas do período foram suficientes para cobrir as despesas realizadas, e o Fundo mantém disponibilidade financeira de ${rs(x.saldoFinal)} ao final do mês. Ainda assim, é importante destacar que o resultado deve ser acompanhado em conjunto com as demais variáveis orçamentárias e extraorçamentárias.`, false]];

  const simples = {
    NUMERO: (p.numero || "").trim() || "____/DCG-SMTFC",
    MES_ANO: mesAno,
    ANO: ano,
    LEI: (estado.parecer.lei || LEI_PADRAO).trim().replace(/,$/, ""),
    VALOR_LOA: rsExtenso(prev),
    DATA: dataPorExtenso(p.data || hojeIso()),
  };
  return { paragrafos: t, simples };
}

/* XML do Word */

const escXml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function runsXml(rPr, segmentos) {
  const base = rPr.replace(/<w:b\/>|<w:bCs\/>/g, "");
  const negrito = /<w:rFonts[^>]*\/>/.test(base)
    ? base.replace(/(<w:rFonts[^>]*\/>)/, "$1<w:b/><w:bCs/>")
    : base.replace("<w:rPr>", "<w:rPr><w:b/><w:bCs/>");
  return segmentos.map(([texto, b]) => `<w:r>${b ? negrito : base}<w:t xml:space="preserve">${escXml(texto)}</w:t></w:r>`).join("");
}

const CINZA_ESCURO = "A6A6A6", CINZA_CLARO = "D9D9D9";

function rPrTabela(negrito, cor) {
  return `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${negrito ? "<w:b/><w:bCs/>" : ""}${cor ? `<w:color w:val="${cor}"/>` : ""}<w:sz w:val="16"/><w:szCs w:val="16"/></w:rPr>`;
}

/** Célula: { texto, larg, alin, negrito, fundo, span, moeda (centavos), cor } */
function celulaXml(c) {
  const larg = c.larg;
  const tcPr = `<w:tcPr><w:tcW w:w="${larg}" w:type="dxa"/>${c.span > 1 ? `<w:gridSpan w:val="${c.span}"/>` : ""}${c.fundo ? `<w:shd w:val="clear" w:color="auto" w:fill="${c.fundo}"/>` : ""}<w:vAlign w:val="center"/></w:tcPr>`;
  const rpr = rPrTabela(c.negrito, c.cor);
  let pPr, runs;
  if (c.moeda !== undefined) {
    pPr = `<w:pPr><w:tabs><w:tab w:val="right" w:pos="${larg - 110}"/></w:tabs><w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/></w:pPr>`;
    const valor = c.moeda ? (c.moeda < 0 ? `-${fmt(-c.moeda)}` : fmt(c.moeda)) : "-";
    runs = `<w:r>${rpr}<w:t>R$</w:t></w:r><w:r>${rpr}<w:tab/><w:t xml:space="preserve">${valor}</w:t></w:r>`;
  } else {
    pPr = `<w:pPr><w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/><w:jc w:val="${c.alin || "left"}"/></w:pPr>`;
    runs = c.texto ? `<w:r>${rpr}<w:t xml:space="preserve">${escXml(c.texto)}</w:t></w:r>` : "";
  }
  return `<w:tc>${tcPr}<w:p>${pPr}${runs}</w:p></w:tc>`;
}

function tabelaXml(larguras, linhas) {
  const total = larguras.reduce((a, b) => a + b, 0);
  const borda = (n) => `<w:${n} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`;
  const grid = larguras.map((w) => `<w:gridCol w:w="${w}"/>`).join("");
  const rows = linhas.map((cels) => {
    let col = 0;
    const tcs = cels.map((c) => {
      const span = c.span || 1;
      const larg = larguras.slice(col, col + span).reduce((a, b) => a + b, 0);
      col += span;
      return celulaXml({ ...c, larg, span });
    }).join("");
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${tcs}</w:tr>`;
  }).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${["top", "left", "bottom", "right", "insideH", "insideV"].map(borda).join("")}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="50" w:type="dxa"/><w:right w:w="50" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rows}</w:tbl><w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:p>`;
}

function quadrosParecer(m, r) {
  const x = r[m];
  const cab = (texto) => ({ texto, alin: "center", negrito: true, fundo: CINZA_ESCURO });
  const tit = (texto, destaque) => ({ texto, negrito: destaque, fundo: destaque ? CINZA_CLARO : undefined });
  const din = (c, destaque) => ({ moeda: c, negrito: destaque, fundo: destaque ? CINZA_CLARO : undefined });
  const pc = (a, b, destaque) => ({ texto: pctTexto(a, b), alin: "center", negrito: destaque, fundo: destaque ? CINZA_CLARO : undefined });

  const prev = v(m, "receita_prevista"), atu = v(m, "receita_atualizada"), real = v(m, "receita_realizada");
  const linhaRec = (t, pre) => [tit(t), din(v(m, `${pre}_previsto`)), din(v(m, `${pre}_atualizado`)), din(v(m, `${pre}_realizado`)),
    pc(v(m, `${pre}_realizado`), v(m, `${pre}_previsto`)), pc(v(m, `${pre}_realizado`), v(m, `${pre}_atualizado`))];
  const q1 = tabelaXml([1750, 1600, 1600, 1600, 977, 977], [
    ["TÍTULOS", "RECEITA PREVISTA", "RECEITA ATUALIZADA", "REALIZAÇÃO", "% PREVISTO", "% ATUALIZADO"].map(cab),
    [tit("Receitas Correntes"), din(prev), din(atu), din(real), pc(real, prev), pc(real, atu)],
    [tit("Total", true), din(prev, true), din(atu, true), din(real, true), pc(real, prev, true), pc(real, atu, true)],
    linhaRec("Superávit Fin. Exer. Anterior", "superavit"),
    linhaRec("Excesso de Arrecadação", "excesso"),
    linhaRec("Saldo do Mês Anterior", "saldo_mes_ant"),
    [tit("Total Acumulado", true), din(prev, true), din(atu, true), din(x.recAcum, true), pc(x.recAcum, prev, true), pc(x.recAcum, atu, true)],
  ]);

  const linhaDesp = (t, pre) => [tit(t), din(v(m, `${pre}_inicial`)), din(v(m, `${pre}_autorizada`)), din(v(m, `${pre}_execucao`)),
    pc(v(m, `${pre}_execucao`), v(m, `${pre}_autorizada`))];
  const q2 = tabelaXml([2300, 1600, 1600, 1600, 1404], [
    ["TÍTULOS", "DOTAÇÃO INICIAL", "DOTAÇÃO AUTORIZADA", "EXECUÇÃO", "PERCENTUAL"].map(cab),
    linhaDesp("Despesas Correntes", "correntes"),
    linhaDesp("Despesas de Capital e Amortização", "capital"),
    [tit("Total", true), din(x.dotIni, true), din(x.dotAut, true), din(x.despTotal, true), pc(x.despTotal, x.dotAut, true)],
    linhaDesp("Reserva de Contingência", "reserva"),
    linhaDesp("Suplementação", "suplementacao"),
    linhaDesp("Dotação Especial", "especial"),
    linhaDesp("Anulações", "anulacoes"),
    [tit("Total Acumulado", true), din(x.dotAcumIni, true), din(x.dotAcumAut, true), din(x.despAcum, true), pc(x.despAcum, x.dotAcumIni, true)],
  ]);

  const primeiro = m === "jan";
  const fin = [
    ["Receita Orçamentária", real, "Despesa Orçamentária", x.despOrc],
    ["Transf. Recebida Orçamentária", v(m, "transf_recebida_orcamentaria"), "Transf. Concedida Orçamentária", v(m, "transf_concedida_orcamentaria")],
    ["Receita Extraorçamentária", v(m, "receita_extraorcamentaria"), "Despesa Extraorçamentária", v(m, "despesa_extraorcamentaria")],
    ["Transf. Recebida Extraorçamentária", v(m, "transf_recebida_extraorcamentaria"), "Transf. Concedida Extraorçamentária", v(m, "transf_concedida_extraorcamentaria")],
    [primeiro ? "Saldo do Exercício Anterior" : "Saldo do Mês Anterior", x.saldoAnterior, "Saldo para o Exercício Seguinte", x.saldoFinal],
  ];
  const q3 = tabelaXml([2802, 1450, 2802, 1450], [
    [{ ...cab("RECEITA"), span: 2 }, { ...cab("DESPESA"), span: 2 }],
    [{ texto: "INGRESSOS", alin: "center", negrito: true, fundo: CINZA_CLARO }, din(x.ingressos, true),
      { texto: "DISPÊNDIOS", alin: "center", negrito: true, fundo: CINZA_CLARO }, din(x.dispendios, true)],
    ...fin.map(([a, va, b, vb]) => [tit(a), din(va), tit(b), din(vb)]),
  ]);

  const q4 = tabelaXml([3300, 3300], [
    [{ ...cab("RFP = (RO + RE) - (DO + DE)"), span: 2 }],
    [{ texto: rs(x.roRe).replace("R$ ", "R$ "), alin: "center" }, { texto: "(RO + RE)", alin: "center", negrito: true }],
    [{ texto: rs(x.doDe), alin: "center" }, { texto: "(DO + DE)", alin: "center", negrito: true }],
    [{ texto: x.rfp < 0 ? `-R$ ${fmt(-x.rfp)}` : rs(x.rfp), alin: "center", negrito: true, fundo: CINZA_CLARO, cor: x.rfp < 0 ? "C00000" : undefined },
      { texto: "RFP", alin: "center", negrito: true }],
  ]);
  return { QUADRO1: q1, QUADRO2: q2, QUADRO3: q3, QUADRO4: q4 };
}

async function gerarParecer(m) {
  if (!MODELO_PARECER) throw new Error("O modelo do parecer não está embutido nesta versão do aplicativo.");
  if (typeof JSZip === "undefined") throw new Error("A biblioteca do Word não carregou. Recarregue a página.");
  const r = calcular();
  const zip = await JSZip.loadAsync(MODELO_PARECER, { base64: true });
  let xml = await zip.file("word/document.xml").async("string");
  const { paragrafos, simples } = textosParecer(m, r);
  for (const [nome, segmentos] of Object.entries(paragrafos)) {
    const re = new RegExp(`<w:r>(<w:rPr>(?:(?!</w:rPr>)[\\s\\S])*</w:rPr>)<w:t xml:space="preserve">\\{\\{${nome}\\}\\}</w:t></w:r>`);
    if (!re.test(xml)) throw new Error(`Modelo do parecer sem o marcador ${nome}.`);
    xml = xml.replace(re, (_, rPr) => runsXml(rPr, segmentos));
  }
  for (const [nome, tabela] of Object.entries(quadrosParecer(m, r))) {
    const marcador = `<w:p><w:r><w:t>{{${nome}}}</w:t></w:r></w:p>`;
    if (!xml.includes(marcador)) throw new Error(`Modelo do parecer sem o marcador ${nome}.`);
    xml = xml.replace(marcador, () => tabela);
  }
  for (const [nome, valor] of Object.entries(simples)) xml = xml.split(`{{${nome}}}`).join(escXml(valor));
  const restante = xml.match(/\{\{[A-Z_0-9]+\}\}/);
  if (restante) throw new Error(`Marcador não preenchido no modelo: ${restante[0]}`);
  zip.file("word/document.xml", xml);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", compression: "DEFLATE" });
}

function painelParecer(m, r) {
  const p = dadosParecer(m);
  const i = MESES.indexOf(m);
  const campo = (rotulo, dica, tag, props, chave, global = false) => {
    const input = el(tag, { id: `parecer-${chave}`, ...props });
    input.value = global ? (estado.parecer[chave] ?? "") : (p[chave] ?? "");
    input.addEventListener("input", () => {
      if (global) estado.parecer[chave] = input.value; else p[chave] = input.value;
      salvarLocal();
    });
    return el("label", { for: `parecer-${chave}` }, rotulo, dica ? el("small", { text: dica }) : null, input);
  };
  if (!p.data) p.data = hojeIso();
  const botao = el("button", { type: "button", id: "gerar-parecer" }, "Gerar parecer (Word)");
  botao.disabled = r[m].vazio || !downloads || !MODELO_PARECER;
  botao.addEventListener("click", async () => {
    botao.disabled = true;
    try {
      const blob = await gerarParecer(m);
      const numero = (p.numero || "").trim().replace(/[\\/:*?"<>|]+/g, "-");
      const nome = `Parecer${numero ? ` ${numero}` : ""} - FEMTA ${NOMES[i]} ${$("ano").value}.docx`;
      await downloads.save({ filename: nome, data: blob });
      mensagem(r[m].situacao === "verificar" ? "erro" : "info", r[m].situacao === "verificar"
        ? `Parecer de ${NOMES[i].toLowerCase()} gerado, mas as conferências do mês não fecharam. Revise os valores antes de usar o parecer.`
        : `Parecer de ${NOMES[i].toLowerCase()} gerado. Revise o texto no Word antes de assinar.`);
    } catch (e) {
      if (e?.code === "unavailable" || e?.code === "not_granted") mensagem("erro", "O download não está disponível nesta visualização.");
      else if (e?.code !== "declined") mensagem("erro", `Não foi possível gerar o parecer: ${e?.message ?? e}`);
    } finally {
      botao.disabled = r[m].vazio || !downloads || !MODELO_PARECER;
    }
  });
  return el("section", { class: "quadro" }, el("h3", { text: "Parecer do mês" }),
    el("div", { class: "form-parecer" },
      campo("Número do parecer", "ex.: 110-2026/DCG-SMTFC", "input", { type: "text", placeholder: "110-2026/DCG-SMTFC" }, "numero"),
      campo("Data do parecer", null, "input", { type: "date" }, "data"),
      campo("Composição da receita do mês", "opcional; entra depois do valor arrecadado", "textarea",
        { placeholder: "R$ 45.074,25 de remuneração de depósitos bancários e R$ 1.076.055,18 de multas previstas na legislação de trânsito" }, "composicao"),
      campo("Lei Orçamentária do exercício", "vale para todos os meses", "input", { type: "text" }, "lei", true),
      el("div", { class: "barra" }, botao),
      r[m].vazio ? el("p", { class: "nota", text: "Preencha o mês para gerar o parecer." }) : null));
}

/* ---------- Eventos ---------- */

let downloads = null;

$("baixar").addEventListener("click", async () => {
  if (!downloads) return;
  const botao = $("baixar");
  botao.disabled = true;
  try {
    if (typeof ExcelJS === "undefined") throw { message: "A biblioteca do Excel não carregou. Recarregue a página." };
    const blob = await gerarPlanilha();
    const entidade = $("entidade").value.trim();
    const sigla = (entidade.match(/[–-]\s*([A-Z]{2,})\s*$/) || [])[1];
    await downloads.save({ filename: `Base de calculo${sigla ? ` ${sigla}` : ""} ${$("ano").value}.xlsx`, data: blob });
    mensagem();
  } catch (e) {
    if (e?.code === "unavailable" || e?.code === "not_granted") { downloads = null; $("baixar").title = "Download indisponível nesta visualização"; }
    else if (e?.code !== "declined") mensagem("erro", `Não foi possível gerar a planilha: ${e?.message ?? e}`);
  } finally {
    botao.disabled = !downloads;
  }
});

$("importar").addEventListener("change", async () => {
  const arquivo = $("importar").files[0];
  $("importar").value = "";
  if (!arquivo) return;
  try {
    if (typeof ExcelJS === "undefined") throw new Error("A biblioteca do Excel não carregou. Recarregue a página.");
    const { meses, ano } = await importar(arquivo);
    estado.meses = meses;
    if (ano) $("ano").value = ano;
    estado.aba = "jan";
    salvarLocal();
    atualizar();
    const r = calcular();
    const verificar = MESES.filter((m) => r[m].situacao === "verificar");
    mensagem("info", `Planilha "${arquivo.name}" importada.` + (verificar.length
      ? ` Meses com conferência a verificar: ${verificar.join(", ")}.` : " Todas as conferências fecharam."));
  } catch (e) {
    mensagem("erro", e.message);
  }
});

$("novo").addEventListener("click", () => { $("confirmar-novo").hidden = false; $("confirmar-nao").focus(); });
$("confirmar-nao").addEventListener("click", () => { $("confirmar-novo").hidden = true; });
$("confirmar-sim").addEventListener("click", () => {
  const saldoDez = v("dez", "saldo_final");
  estado.meses = vazio();
  if (saldoDez) estado.meses.jan.saldo_exercicio_anterior = saldoDez;
  estado.parecer.meses = {};
  $("ano").value = Number($("ano").value) + 1;
  estado.aba = "jan";
  $("confirmar-novo").hidden = true;
  salvarLocal();
  atualizar();
  mensagem("info", saldoDez ? `Exercício ${$("ano").value} iniciado. O saldo final de dezembro (${fmt(saldoDez)}) foi levado para o saldo do exercício anterior de janeiro.` : `Exercício ${$("ano").value} iniciado.`);
});
$("entidade").addEventListener("change", salvarLocal);
$("ano").addEventListener("change", () => { salvarLocal(); atualizar(); });

if (!carregarLocal() && DADOS_INICIAIS) estado.meses = { ...vazio(), ...DADOS_INICIAIS };
atualizar();

$("baixar").disabled = true;
(async () => {
  if (!window.claude) {
    // Arquivo aberto direto no navegador (versão para o computador): download comum.
    downloads = {
      async save({ filename, data }) {
        const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
        const link = el("a", { href: url, download: filename });
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return { status: "saved" };
      },
    };
  } else {
    try { downloads = await window.claude.use("downloads"); } catch { downloads = null; }
  }
  $("baixar").disabled = !downloads;
  if (!downloads) $("baixar").title = "Download indisponível nesta visualização";
})();
</script>
